spring.application.name=taller-directorio-funcionarios

# Conexion a MySQL. Cada valor puede cambiarse con una variable de entorno;
# si no existe la variable, se usa el valor que aparece despues de los dos puntos.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:directorio_funcionarios}?createDatabaseIfNotExist=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate crea o ajusta la tabla "funcionarios" sin borrar los datos existentes.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=${PORT:8080}
